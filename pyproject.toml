[project]
name = "coating-maintenance-agent"
version = "0.1.0"
description = "Reproducible simulated battery electrode coating maintenance agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "langgraph>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "rank-bm25>=0.2.2,<1",
  "numpy>=2,<3",
  "scikit-learn>=1.6,<2",
  "xgboost>=2.1,<4",
  "joblib>=1.4,<2",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coating_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
